analysis_howto=So funktioniert die Analyse:\n\n1.  DAW Notes als letztes Plugin auf den Master-Bus legen (nach Limiter/Mastering).\n2.  Oben das passende Genre-Profil prüfen (kommt aus dem Genre-Feld der Song Vision).\n3.  "Analyse" drücken und den kompletten Song einmal von Anfang bis Ende abspielen.\n4.  DAW Notes hört zu und beendet die Analyse automatisch, wenn die Wiedergabe stoppt\n     (oder du klickst auf "Fertig").\n\nGemessen werden Lautheit (LUFS), Dynamik, Spitzenpegel, Stereobild, Bass-Mono,\nFrequenzbalance, Tempo und Tonart – und mit typischen Werten des Genres verglichen.
