ga_ausgewogener_bass=ausgewogener Bass
ga_band_high_0=Sehr viel Sub-Bass: Gefahr von Dröhnen/verschenktem Headroom - Sub entschlacken oder High-Pass auf Nicht-Bass-Spuren.
ga_band_high_1=Bassbereich dominant: Kick und Bass per Sidechain/EQ entzerren, Mud bei 100-200 Hz prüfen.
ga_band_high_2=Tiefe Mitten zu voll ("Mulm"): Bei 250-500 Hz auf Pads, Gitarren, Synths etwas absenken.
ga_band_high_3=Mitten sehr präsent: Kann nasal/boxy klingen - Überlagerungen bei 0,5-2 kHz ausdünnen.
ga_band_high_4=Präsenzbereich scharf: Ermüdungsgefahr - 2-6 kHz zähmen, De-Esser oder dynamischer EQ.
ga_band_high_5=Sehr viele Höhen: Kann zischeln - Hi-Hats/Becken leiser oder High-Shelf ab 8 kHz absenken.
ga_band_low_0=Zu wenig Sub-Bass: Kick/Bass-Fundament (40-60 Hz) stärken, z.B. Sub-Layer oder Low-Shelf.
ga_band_low_1=Bassbereich zu dünn: Kick und Bass mehr Körper geben (80-200 Hz).
ga_band_low_2=Tiefe Mitten sehr schlank: Etwas Wärme bei 250-500 Hz kann den Mix voller machen.
ga_band_low_3=Mitten zurückhaltend: Lead, Vocals oder Synths könnten mehr Präsenz bei 0,5-2 kHz vertragen.
ga_band_low_4=Wenig Präsenz: Der Mix wirkt evtl. dumpf - 2-6 kHz vorsichtig anheben (Vocals, Snare, Leads).
ga_band_low_5=Wenig Höhen/Air: Hi-Hats, Becken oder ein sanftes High-Shelf ab 8 kHz bringen Glanz.
