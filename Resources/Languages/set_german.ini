about_story=Wie DAW Notes entstanden ist\n\nDAW Notes ist während der S.P.R.I.N.T.-Challenge von Daniel Agema (www.hearbeat.de) entstanden: sechs Wochen Training, um schneller, fokussierter und mit klaren Zielen zu producen.\n\nDas Prinzip: eine Stunde pro Producer-Tag. Zuerst entsteht ein 8- bis 16-taktiger Prototyp – egal wie weit man kommt. Dann bleibt er 7 bis 10 Tage liegen, ohne ihn anzuhören.\n\nBeim ersten frischen Hören kommt DAW Notes ins Spiel: Welche Gefühle löst der Proto aus? BPM, Genre, Akkorde und Moods landen in der Song Vision – dem Rettungsanker, wenn der Song später vom Kurs abkommt.\n\nDanach wird der Proto mit Sounds überladen, ein Referenzsong gesucht und ein Ghost-Arrangement gebaut: das blanke Baugerüst eines erfolgreichen Songs, das nach und nach befüllt wird.\n\nBeim nächsten Durchhören wird nicht „ganz kurz mal“ korrigiert. Alles, was auffällt, wandert in die Session ToDos – so bleibt das Ohr frisch bis zum letzten Takt.\n\nAn Tag X ist der Song fertig. Denn: Fertig kommt vor Perfekt!\n\nDie Release ToDos erinnern an alles, was danach noch ansteht: Release-Datum, Distribution, Cover, Videos für TikTok und YouTube.\n\nMit Version 2.0 hört DAW Notes jetzt auch zu: Der Reiter Analyse vergleicht deinen Mix mit typischen Werten deines Genres, und Referenztracks verraten Tempo, Tonart, Akkorde und Stimmung.\n\nDanke an Daniel Agema für sechs intensive Wochen, an Kerstin für ihre Geduld und an die KI-Assistenten, ohne die DAW Notes nicht so schnell fertig geworden wäre.\n\nDAW Notes ist kostenlos und speichert alles lokal auf deinem Studio-Rechner. Wenn es dir hilft, freue ich mich über eine kleine Spende oder einen Besuch auf www.undabtanzbar.de – dort findest du auch meine Musik.\n\nViel Spaß beim nächsten Song!\n\nKay Fiedler a.k.a. Yakobo Yak / Un(d)AbtanzBAR
