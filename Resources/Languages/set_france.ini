ga_ausgewogener_bass=basses équilibrées
ga_band_high_0=Beaucoup de sub-basses : risque de bourdonnement/headroom gaspillé – nettoyez le sub ou appliquez un passe-haut aux pistes hors basses.
ga_band_high_1=Basses dominantes : séparez kick et basse par sidechain/EQ, vérifiez la boue à 100-200 Hz.
ga_band_high_2=Bas-médiums trop chargés (« boue ») : atténuez un peu pads, guitares et synthés à 250-500 Hz.
ga_band_high_3=Médiums très présents : son nasal/boîte possible – allégez les superpositions à 0,5-2 kHz.
ga_band_high_4=Zone de présence agressive : fatigue d'écoute – domptez 2-6 kHz, de-esser ou EQ dynamique.
ga_band_high_5=Beaucoup d'aigus : risque de sifflement – baissez charleys/cymbales ou atténuez à partir de 8 kHz.
ga_band_low_0=Trop peu de sub-basses : renforcez la base kick/basse (40-60 Hz), p. ex. couche sub ou low shelf.
ga_band_low_1=Basses trop fines : donnez plus de corps au kick et à la basse (80-200 Hz).
ga_band_low_2=Bas-médiums très minces : un peu de chaleur à 250-500 Hz peut étoffer le mix.
ga_band_low_3=Médiums en retrait : lead, voix ou synthés gagneraient en présence à 0,5-2 kHz.
ga_band_low_4=Peu de présence : le mix peut sembler terne – remontez prudemment 2-6 kHz (voix, caisse claire, leads).
ga_band_low_5=Peu d'aigus/d'air : charleys, cymbales ou un léger high shelf dès 8 kHz apportent de l'éclat.
