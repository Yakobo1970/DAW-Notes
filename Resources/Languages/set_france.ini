analysis_howto=Fonctionnement de l'analyse :\n\n1.  Placez DAW Notes en dernier plugin sur le bus master (après limiteur/mastering).\n2.  Vérifiez le profil de genre en haut (issu du champ genre de la Song Vision).\n3.  Appuyez sur « Analyser » et jouez le morceau entier une fois du début à la fin.\n4.  DAW Notes écoute et termine l'analyse automatiquement à l'arrêt de la lecture\n     (ou cliquez sur « Terminer »).\n\nSont mesurés : loudness (LUFS), dynamique, niveau crête, image stéréo, basses mono,\nbalance fréquentielle, tempo et tonalité – puis comparés aux valeurs typiques du genre.
