about_story=How DAW Notes came to be\n\nDAW Notes was born during the S.P.R.I.N.T. challenge by Daniel Agema (www.hearbeat.de): six weeks of training to produce faster, more focused and with clear goals.\n\nThe principle: one hour per producer day. First you build an 8 to 16 bar prototype – no matter how far you get. Then it rests for 7 to 10 days without listening to it.\n\nAt the first fresh listen, DAW Notes comes into play: what feelings does the proto trigger? BPM, genre, chords and moods go into the Song Vision – your lifeline when the song drifts off course later.\n\nNext, the proto gets overloaded with sounds, a reference song is chosen and a ghost arrangement is built: the bare scaffold of a successful song that you fill step by step.\n\nOn the next listen you do not fix things "just quickly". Everything you notice goes into the Session ToDos – so your ears stay fresh until the last bar.\n\nOn day X the song is finished. Because: done beats perfect!\n\nThe Release ToDos remind you of everything that comes afterwards: release date, distribution, cover art, videos for TikTok and YouTube.\n\nWith version 2.0, DAW Notes now listens too: the Analysis tab compares your mix with typical values of your genre, and reference tracks reveal tempo, key, chords and mood.\n\nThanks to Daniel Agema for six intense weeks, to Kerstin for her patience and to the AI assistants without whom DAW Notes would not have been finished so quickly.\n\nDAW Notes is free and stores everything locally on your studio computer. If it helps you, I would be happy about a small donation or a visit to www.undabtanzbar.de – where you will also find my music.\n\nHave fun with your next song!\n\nKay Fiedler a.k.a. Yakobo Yak / Un(d)AbtanzBAR
