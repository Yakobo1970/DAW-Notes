analysis_howto=How the analysis works:\n\n1.  Put DAW Notes as the last plugin on the master bus (after limiter/mastering).\n2.  Check the matching genre profile at the top (taken from the genre field of the Song Vision).\n3.  Press "Analyse" and play the complete song once from start to finish.\n4.  DAW Notes listens and finishes the analysis automatically when playback stops\n     (or click "Finish").\n\nMeasured are loudness (LUFS), dynamics, peak level, stereo image, bass mono,\nfrequency balance, tempo and key – and compared with typical values of the genre.
