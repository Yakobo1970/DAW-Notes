ga_akkord_schema_geschaetzt=Chord scheme (estimated): 
ga_ausgewogener_bass=balanced bass
ga_band_high_0=Lots of sub bass: risk of booming/wasted headroom – clean up the sub or high-pass non-bass tracks.
ga_band_high_1=Bass range dominant: separate kick and bass with sidechain/EQ, check for mud at 100-200 Hz.
ga_band_high_2=Low mids too full ("mud"): cut pads, guitars and synths a little at 250-500 Hz.
ga_band_high_3=Mids very present: can sound nasal/boxy – thin out overlaps at 0.5-2 kHz.
ga_band_high_4=Presence range harsh: listening fatigue – tame 2-6 kHz, de-esser or dynamic EQ.
ga_band_high_5=Lots of highs: can sound hissy – lower hi-hats/cymbals or use a high shelf cut from 8 kHz.
ga_band_low_0=Too little sub bass: strengthen the kick/bass foundation (40-60 Hz), e.g. sub layer or low shelf.
ga_band_low_1=Bass range too thin: give kick and bass more body (80-200 Hz).
ga_band_low_2=Low mids very lean: a little warmth at 250-500 Hz can make the mix fuller.
ga_band_low_3=Mids reserved: lead, vocals or synths could use more presence at 0.5-2 kHz.
ga_band_low_4=Little presence: the mix may sound dull – carefully boost 2-6 kHz (vocals, snare, leads).
ga_band_low_5=Little highs/air: hi-hats, cymbals or a gentle high shelf from 8 kHz add sparkle.
